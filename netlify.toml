[build]
  base    = "client"
  publish = "client"
  command = "npm install"

# ── User pages ───────────────────────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/html/index.html"
  status = 200

[[redirects]]
  from   = "/order"
  to     = "/html/order.html"
  status = 200

[[redirects]]
  from   = "/feedback"
  to     = "/html/feedback.html"
  status = 200

[[redirects]]
  from   = "/aboutUs"
  to     = "/html/aboutUs.html"
  status = 200

[[redirects]]
  from   = "/checkout"
  to     = "/html/checkout.html"
  status = 200

[[redirects]]
  from   = "/gcash-payment"
  to     = "/html/gcash-payment.html"
